<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Face Recognition Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Face Recognition Dashboard</h1>

  <div class="panels">
    <div class="panel">
      <h2>Enroll a Profile</h2>
      <form id="enroll-form">
        <input type="text" name="name" placeholder="Name" required>
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Enroll</button>
      </form>
      <div id="enroll-result" class="result hidden"></div>
    </div>

    <div class="panel">
      <h2>Recognize</h2>
      <form id="recognize-form">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Recognize</button>
      </form>
      <div id="recognize-result" class="result hidden"></div>
    </div>
  </div>

  <h2>Enrolled Profiles</h2>
  <ul id="profile-list"></ul>

  <script src="app.js"></script>
</body>
</html>
