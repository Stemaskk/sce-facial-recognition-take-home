<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Face Recognition Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Face Recognition Dashboard</h1>

  <div class="panel">
    <h2>Enroll a Profile</h2>
    <form id="enroll-form">
      <input type="text" name="name" placeholder="Name" required>
      <div class="enroll-image-controls">
        <input type="file" id="enroll-file-input" name="image" accept="image/*">
        <span>or</span>
        <button type="button" id="capture-photo-btn">Capture Photo</button>
      </div>
      <img id="capture-preview" class="capture-preview hidden" alt="Captured preview">
      <button type="submit">Enroll</button>
    </form>
    <div id="enroll-result" class="result hidden"></div>
  </div>

  <div class="panel panel-live">
    <h2>Live Scan (Webcam)</h2>
    <div class="live-controls">
      <button id="live-start-btn" type="button">Start Camera</button>
      <button id="live-stop-btn" type="button" disabled>Stop Camera</button>
      <span id="live-status" class="live-status">Camera off</span>
    </div>
    <div class="video-wrap" id="video-wrap">
      <video id="live-video" autoplay playsinline muted></video>
      <canvas id="live-overlay"></canvas>
    </div>
  </div>

  <h2>Enrolled Profiles</h2>
  <ul id="profile-list"></ul>

  <script src="app.js"></script>
</body>
</html>
